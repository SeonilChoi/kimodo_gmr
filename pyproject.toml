[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kimodo_gmr"
version = "1.0.0"
description = "Kimodo motion generation + General Motion Retargeting (GMR) for humanoid robots"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0 (kimodo), MIT (general_motion_retargeting)"}
dependencies = [
  # kimodo
  "torch",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.23",
  "scipy>=1.10",
  "transformers==5.1.0",
  "urllib3>=2.6.3",
  "peft>=0.18",
  "einops>=0.7",
  "tqdm>=4.0",
  "packaging>=21.0",
  "pydantic>=2.0",
  "filelock>=3.20.3",
  "gradio>=6.8.0",
  "gradio_client>=1.0",
  "bvhio",
  # general_motion_retargeting
  "loop_rate_limiters",
  "mink",
  "mujoco",
  "qpsolvers[daqp]",
  "rich",
  "smplx @ git+https://github.com/vchoutas/smplx",
  "imageio[ffmpeg]",
]

[project.scripts]
kimodo_gen = "kimodo.scripts.generate:main"
kimodo_textencoder = "kimodo.scripts.run_text_encoder_server:main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
kimodo = ["assets/**/*"]
general_motion_retargeting = ["ik_configs/*.json"]

[tool.ruff]
extend-select = ["I001"]  # Enable import sorting
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["kimodo", "general_motion_retargeting"]
